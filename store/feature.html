<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("display.ttf"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #F5EEE2; font-family: "Display", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(54% 82% at 24% 30%, rgba(242, 166, 43, 0.22), rgba(242, 166, 43, 0) 62%),
      radial-gradient(48% 72% at 6% 98%, rgba(228, 85, 43, 0.13), rgba(228, 85, 43, 0) 66%),
      linear-gradient(158deg, #241C15 0%, #141110 46%, #090807 100%);
  }
  .grain { position: absolute; inset: 0; opacity: 0.075; mix-blend-mode: overlay;
    background-image: repeating-radial-gradient(circle at 21% 37%, rgba(255,255,255,0.9) 0 0.6px, transparent 0.6px 2.9px),
                      repeating-radial-gradient(circle at 68% 74%, rgba(255,255,255,0.7) 0 0.5px, transparent 0.5px 2.5px); }
  .dust { position: absolute; border-radius: 50%; background: #F6D9A0; }
  svg.mark { position: absolute; left: 60px; top: 42px; width: 400px; height: 400px; }
  .rule { position: absolute; left: 500px; top: 104px; width: 84px; height: 5px; border-radius: 3px;
          background: linear-gradient(90deg, #FFD980, #F2A62B 55%, #E4552B); }
  .copy { position: absolute; left: 498px; top: 132px; width: 490px; }
  h1 { margin: 0; font-size: 86px; line-height: 0.95; letter-spacing: -0.038em; font-weight: 700;
       text-shadow: 0 8px 34px rgba(10, 6, 2, 0.6); }
  p { margin: 28px 0 0 3px; font-size: 27px; line-height: 1.25; color: #F2A62B; max-width: 480px; }
  .foot { position: absolute; left: 501px; top: 404px; font-size: 14px; letter-spacing: 0.2em;
          text-transform: uppercase; color: #8C8374; font-weight: 700; }
  .perfs { position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
           background: repeating-linear-gradient(90deg, #302921 0 9px, transparent 9px 16px); }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="dust" style="left:646px;top:66px;width:4px;height:4px;opacity:.3"></div>
  <div class="dust" style="left:930px;top:118px;width:3px;height:3px;opacity:.24"></div>
  <div class="dust" style="left:806px;top:452px;width:3px;height:3px;opacity:.18"></div>
  <div class="dust" style="left:38px;top:438px;width:4px;height:4px;opacity:.2"></div>

  <svg class="mark" viewBox="21 21 66 66" aria-hidden="true">
<defs>
    <linearGradient id="room" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#241C15"/>
      <stop offset="0.46" stop-color="#141110"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="safelight" cx="0.78" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#FFC24A" stop-opacity="0.55"/>
      <stop offset="0.34" stop-color="#E4552B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E4552B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#40382E"/>
      <stop offset="0.38" stop-color="#2B241B"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <!-- the leak, hot at the corner and gone by the far side of the frame -->
    <!-- a leak spreads out from the corner the light got in at, so it is a radial and
         not a wash: hot core, Kodak yellow, film orange, then nothing but base black -->
    <radialGradient id="leak" gradientUnits="userSpaceOnUse" cx="67.03" cy="34.30" r="37">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.07" stop-color="#FFE9AE"/>
      <stop offset="0.17" stop-color="#FBC748"/>
      <stop offset="0.29" stop-color="#F4901F"/>
      <stop offset="0.42" stop-color="#E4552B"/>
      <stop offset="0.55" stop-color="#8E2E17"/>
      <stop offset="0.68" stop-color="#3A1709"/>
      <stop offset="0.82" stop-color="#0D0B0A"/>
      <stop offset="1" stop-color="#0A0908"/>
    </radialGradient>
    <radialGradient id="hot" gradientUnits="userSpaceOnUse" cx="68.5" cy="33.2" r="20">
      <stop offset="0" stop-color="#FFFEF8" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#FFF0C8" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#FFCE62" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2A62B" stop-opacity="0"/>
    </radialGradient>
    <!-- light coming through the perforations nearest the leak -->
    <radialGradient id="thru" gradientUnits="userSpaceOnUse" cx="69" cy="32" r="21">
      <stop offset="0" stop-color="#FFF6DC" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#F9BC3C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2A62B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <clipPath id="win"><rect x="40.97" y="34.30" width="26.06" height="39.40" rx="0.8"/></clipPath>
    <clipPath id="filmclip"><rect x="35.0" y="30.5" width="38.0" height="47.0" rx="1.5"/></clipPath>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="3"/>
      <feFlood flood-color="#280E02" flood-opacity="0.8"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
  </defs>
<g id="fg">
    <!-- light spilling out past the edge of the film, so it reads as a leak and not a fill -->
    <path d="M73.0 30.5 L73.0 51.5 L49.0 30.5 Z" fill="#FFD173" opacity="0.55" filter="url(#bloom)"/>
    <g filter="url(#drop)">
      <rect x="35.0" y="30.5" width="38.0" height="47.0" rx="1.5" fill="url(#base)"/>
      <g clip-path="url(#filmclip)">
        <rect x="40.97" y="34.30" width="26.06" height="39.40" rx="0.8" fill="#0B0A09"/>
        <g clip-path="url(#win)">
          <rect x="40.97" y="34.30" width="26.06" height="39.40" fill="url(#leak)"/>
          <rect x="40.97" y="34.30" width="26.06" height="39.40" fill="url(#hot)"/>
        </g>
        <!-- the leak carries on across the rebate, as it does on real film -->
        <path d="M73.0 30.5 L73.0 45.5 L56.0 30.5 Z" fill="url(#hot)" opacity="0.95"/>
        <g fill="#0A0908"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
        <g fill="url(#thru)"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
        <g fill="none" stroke="#FFE7B4" stroke-width="0.14" opacity="0.26"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
        <rect x="35.0" y="30.5" width="38.0" height="47.0" fill="url(#sheen)"/>
      </g>
      <rect x="35.3" y="30.8" width="37.4" height="46.4" rx="1.3" fill="none"
            stroke="#FFE3AC" stroke-width="0.55" opacity="0.32"/>
      <path d="M72.7 32.1v18" fill="none" stroke="#FFF0C8" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
      <path d="M37.3 30.8h33" fill="none" stroke="#FFE3AC" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
      <rect x="40.97" y="34.30" width="26.06" height="39.40" rx="0.8" fill="none"
            stroke="#0A0908" stroke-width="0.45" opacity="0.65"/>
    </g>
  </g>
  </svg>

  <div class="rule"></div>
  <div class="copy">
    <h1>Contact Sheet</h1>
    <p>Thirty-six chances. No take-backs.</p>
  </div>
  <div class="foot">No preview. It develops tomorrow at eight</div>
  <div class="perfs"></div>
</body>
</html>
