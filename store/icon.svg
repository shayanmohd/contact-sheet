<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Contact Sheet. One frame of 135 film stood upright: the perforation runs down both
       rebates at their true 4.75mm pitch, eight to a 36mm frame, and a light leak burning
       in from the top right corner the way it does off the cassette mouth. Kodak yellow
       into film orange, on the near black of a darkroom. The film piece is the same object
       mark.js draws inside the app, at the same geometry. -->
  <defs>
    <linearGradient id="room" x1="0.14" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#181210"/>
      <stop offset="0.42" stop-color="#0D0B0A"/>
      <stop offset="1" stop-color="#060505"/>
    </linearGradient>
    <!-- the light in the room comes from one corner and dies fast, so the rest stays black -->
    <radialGradient id="safelight" cx="0.88" cy="0.1" r="0.62">
      <stop offset="0" stop-color="#FFC24A" stop-opacity="0.62"/>
      <stop offset="0.3" stop-color="#E4552B" stop-opacity="0.22"/>
      <stop offset="0.68" stop-color="#E4552B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E4552B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- film base, lit from the leak corner: bright enough that the perforations read as
         a dashed edge even on a 48px tile -->
    <linearGradient id="base" x1="0.92" y1="0.04" x2="0.1" y2="1">
      <stop offset="0" stop-color="#EFD9AC"/>
      <stop offset="0.18" stop-color="#A88F69"/>
      <stop offset="0.55" stop-color="#5B4C3B"/>
      <stop offset="1" stop-color="#2E251C"/>
    </linearGradient>
    <radialGradient id="leak" gradientUnits="userSpaceOnUse" cx="67.03" cy="34.30" r="37">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.07" stop-color="#FFE9AE"/>
      <stop offset="0.17" stop-color="#FBC748"/>
      <stop offset="0.29" stop-color="#F4901F"/>
      <stop offset="0.42" stop-color="#E4552B"/>
      <stop offset="0.55" stop-color="#8E2E17"/>
      <stop offset="0.68" stop-color="#3A1709"/>
      <stop offset="0.82" stop-color="#0D0B0A"/>
      <stop offset="1" stop-color="#0A0908"/>
    </radialGradient>
    <radialGradient id="hot" gradientUnits="userSpaceOnUse" cx="68.5" cy="33.2" r="21">
      <stop offset="0" stop-color="#FFFEF8" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#FFF0C8" stop-opacity="0.95"/>
      <stop offset="0.44" stop-color="#FFCE62" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2A62B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thru" gradientUnits="userSpaceOnUse" cx="69" cy="32" r="24">
      <stop offset="0" stop-color="#FFF6DC" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#F9BC3C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2A62B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="40.97" y="34.30" width="26.06" height="39.40" rx="0.8"/></clipPath>
    <clipPath id="filmclip"><rect x="35.0" y="30.5" width="38.0" height="47.0" rx="1.5"/></clipPath>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6"/>
      <feOffset dy="3.2"/>
      <feFlood flood-color="#1A0800" flood-opacity="0.85"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#room)"/>
    <rect width="108" height="108" fill="url(#safelight)"/>
    <rect width="108" height="108" fill="url(#vig)"/>
    <circle cx="21" cy="19" r="0.7" fill="#F6D9A0" opacity="0.22"/>
    <circle cx="89" cy="88" r="0.6" fill="#F6D9A0" opacity="0.16"/>
    <circle cx="16" cy="87" r="0.5" fill="#F6D9A0" opacity="0.13"/>
    <circle cx="93" cy="14" r="0.9" fill="#FFEBC4" opacity="0.4"/>
  </g>

  <g id="fg" transform="translate(54 54) scale(1.09) translate(-54 -54)">
    <!-- light spilling out past the edge of the film, so it reads as a leak and not a fill -->
    <path d="M73.0 30.5 L73.0 52.5 L48.0 30.5 Z" fill="#FFD173" opacity="0.6" filter="url(#bloom)"/>
    <g filter="url(#drop)">
      <rect x="35.0" y="30.5" width="38.0" height="47.0" rx="1.5" fill="url(#base)"/>
      <g clip-path="url(#filmclip)">
        <rect x="40.97" y="34.30" width="26.06" height="39.40" fill="#0B0A09"/>
        <g clip-path="url(#win)">
          <rect x="40.97" y="34.30" width="26.06" height="39.40" fill="url(#leak)"/>
          <rect x="40.97" y="34.30" width="26.06" height="39.40" fill="url(#hot)"/>
        </g>
        <!-- the leak carries on across the rebate, as it does on real film -->
        <path d="M73.0 30.5 L73.0 47.0 L55.0 30.5 Z" fill="url(#hot)" opacity="0.95"/>
        <g fill="#070605"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
        <g fill="url(#thru)"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
        <g fill="none" stroke="#1A140E" stroke-width="0.2" opacity="0.5"><rect x="36.91" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="36.91" y="70.54" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="34.44" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="39.59" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="44.75" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="49.91" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="55.06" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="60.22" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="65.38" width="2.15" height="3.03" rx="0.52"/><rect x="68.94" y="70.54" width="2.15" height="3.03" rx="0.52"/></g>
      </g>
      <rect x="35.3" y="30.8" width="37.4" height="46.4" rx="1.3" fill="none"
            stroke="#FFEFCB" stroke-width="0.5" opacity="0.4"/>
      <rect x="40.97" y="34.30" width="26.06" height="39.40" rx="0.8" fill="none"
            stroke="#0A0908" stroke-width="0.5" opacity="0.7"/>
    </g>
  </g>

  <!-- Themed icons get this and nothing else: the film piece as one silhouette, with the
       perforations and the frame window punched clean through, and the leak as a solid
       wedge in the corner it comes from. -->
  <g id="mono" transform="translate(54 54) scale(1.09) translate(-54 -54)">
